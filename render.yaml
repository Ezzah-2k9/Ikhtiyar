services:
  - type: web
    name: ikhtiyar-v2
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: SECRET_KEY
        generateValue: true
      - key: LOCATIONIQ_KEY
        sync: false
      - key: ORS_KEY
        sync: false
      - key: TOMTOM_KEY
        sync: false
      - key: HERE_API_KEY
        sync: false
      - key: GRAPHHOPPER_KEY
        sync: false
      - key: GEOAPIFY_KEY
        sync: false
      - key: OPENWEATHER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ikhtiyar-v2-db
          property: connectionString

databases:
  - name: ikhtiyar-v2-db
    databaseName: ikhtiyar_v2
    user: ikhtiyar_v2_user
    region: singapore
    plan: free
