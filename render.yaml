
services:
  - type: web
    name: ikhtiyar
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: LOCATIONIQ_KEY
        value: #add your key#
      - key: ORS_KEY
        value: #add your key#
      - key: TOMTOM_KEY
        value: #add your key#
      - key: GRAPHHOPPER_KEY
        value: #add your key#
      - key: GEOAPIFY_KEY
        value: #add your key#
      - key: OPENWEATHER_KEY
        value: #add your key#
      - key: DATABASE_URL
        fromDatabase:
          name: ikhtiyar-db
          property: connectionString
databases:
  - name: ikhtiyar-db
    databaseName: ikhtiyar
    user: ikhtiyar_user
